<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Cat Run</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1128">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root {
    --bg: #0A1128;
    --line: #202B52;
    --text: #EEF1F6;
    --grey: #8A93A6;
    --cyan: #34EDF3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    display: flex;
    flex-direction: column;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 16px max(20px, env(safe-area-inset-left));
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    line-height: 1.05;
    text-decoration: none;
    color: var(--text);
  }
  .brand small { display: block; font-weight: 600; font-size: 0.58rem; letter-spacing: 0.16em; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border: 1px solid var(--cyan);
    border-radius: 4px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .back:hover, .back:focus-visible { background: var(--cyan); color: var(--bg); }
  a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
  .back kbd {
    font-family: inherit;
    font-size: 0.72rem;
    color: var(--grey);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
  }
  .back:hover kbd { color: var(--bg); border-color: var(--bg); }
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
    display: block;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (hover: none) { .back kbd { display: none; } }
</style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="../" aria-label="Big Cat Operations, back to the site">BIG CAT<small>OPERATIONS</small></a>
    <a class="back" href="../">&larr; Back to Big Cat Operations <kbd>Esc</kbd></a>
  </header>
  <iframe id="game" src="game.html" title="Big Cat Run" allow="fullscreen"></iframe>
<script>
  (function () {
    var home = '../';
    function onKey(e) { if (e.key === 'Escape') location.href = home; }
    document.addEventListener('keydown', onKey);
    var frame = document.getElementById('game');
    frame.addEventListener('load', function () {
      // Same origin, so Esc also works while the game has focus
      try { frame.contentWindow.addEventListener('keydown', onKey); } catch (err) {}
      frame.focus();
    });
  })();
</script>
</body>
</html>
